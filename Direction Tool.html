<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Direction Tool</title>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet/dist/leaflet.css"
  />
  <style>
        body {
            margin: 0;
            font-family: Arial;
        }

        #controls {
            padding: 10px;
            background: #f5f5f5;
        }

        #map {
            height: 600px;
            width: 100%;
        }

        input {
            margin: 5px;
        }
        .leaflet-popup-content {
            width: 230px;
            white-space: nowrap;
        }
        
    </style>
</head>
<body>
  <h2>Direction Tool:</h2>
  Upload Splicing detail GeoJSON:
  <input type="file" id="pointFile" accept=".geojson,.json">
  
  Upload Fibers GeoJSON:
  <input type="file" id="lineFile" accept=".geojson,.json" multiple>
    
    <button onclick="downloadGeoJSON()"style="text-decoration: none; padding: 2px 12px; background-color: #ff4bd8; color: white; border-radius: 5px;">Download Splicing content</button>
    <a href="index.html" style="text-decoration: none; padding: 8px 12px; background-color: #00ffdd; color: rgb(104, 104, 104); border-radius: 5px;">Simplify Biarri Splicing Tool</a>
    <a href="Tombstone Formatting Tool.html" style="text-decoration: none; padding: 8px 12px; background-color: #ffe600; color: rgb(107, 107, 107); border-radius: 5px;">Tombstone Formatting Tool</a>
    


  <br><br>
  

  <div id="map"></div>


<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>

<script>

let map = L.map('map').setView([5.4141,100.3288],13);


// OpenStreetMap
L.tileLayer(
    'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
        maxZoom:99,
        attribution:'© OpenStreetMap'
    }
).addTo(map);

// Lines below
map.createPane('linePane');
map.getPane('linePane').style.zIndex = 400;

// Points above
map.createPane('pointPane');
map.getPane('pointPane').style.zIndex = 500;

let pointLayer;
let lineLayer;

let lineFeatures = [];
let exportedFeatures = [];

function loadGeoJSON(file, type){

    let reader = new FileReader();

    reader.onload = function(e){

        let geojson = JSON.parse(e.target.result);


        if(type === "point"){

            if(pointLayer){
                map.removeLayer(pointLayer);
            }

            // prepare GeoJSON export structure
            exportedFeatures = geojson.features.map(f => ({
                type:"Feature",
                geometry:f.geometry,
                properties:{
                    Handhole_ID:f.properties.ID ?? "",
                    Page4_Content:""
                }
            }));

            pointLayer = L.geoJSON(geojson,{

                
                
                pointToLayer:function(feature,latlng){

                    return L.circleMarker(latlng,{
                        pane: 'pointPane',
                        radius:6,
                        color:"blue",
                        fillColor:"cyan",
                        fillOpacity:0.8
                    });

                },

                onEachFeature:function(feature,layer){

                    let p = feature.properties;

                    let page1 = `
                        <b>${p["ID"] ?? ""}</b><br>
                        <b>${p["Tier Rating"] ?? ""} ${p["Size"] ?? ""}</b>
                    `;


                    if(p["Spec_1"] != null && p["Spec_1"] !== ""){

                        page1 += `
                            <br>
                            <b>${p["Spec_1"]}</b><br>
                            ${p["lines"]?.replace(/\n/g, "<br>") ?? ""}
                            </p>
                        `;

                    }


                    if(p["Spec_2"] != null && p["Spec_2"] !== ""){

                        page1 += `
                            <br>
                            <b>${p["Spec_2"]}</b><br>
                            ${p["lines_2"]?.replace(/\n/g, "<br>") ?? ""}
                            </p>
                        `;

                    }


                    if(p["Spec_3"] != null && p["Spec_3"] !== ""){

                        page1 += `
                            <br>
                            <b>${p["Spec_3"]}</b><br>
                            ${p["lines_3"]?.replace(/\n/g, "<br>") ?? ""}
                            </p>
                        `;

                    }


                    // POPUP WITH PAGES
                    let popupContent = `

                        <div class="page1">
                            ${page1}
                        </div>

                        <div class="page2" style="display:none;">
                            Loading cables...
                        </div>

                        <div class="page3" style="display:none;">
                            Loading connection...
                        </div>

                        <div class="page4" style="display:none;">
                            ${exportedFeatures.find(
                                f => f.properties.Handhole_ID === p["ID"]
                            )?.properties.Page4_Content ?? ""}
                        </div>

                        <button onclick="showPage(this,1)">1</button>
                        <button onclick="showPage(this,2)">2</button>
                        <button onclick="showPage(this,3)">3</button>
                        <button onclick="showPage(this,4)">4</button>
                    `;


                    layer.bindPopup(popupContent);

                    layer.on('popupopen', function(){

                        let cables = getIntersectingCables(
                            layer.getLatLng()
                        );

                        let cableDirectionMap = {};

                        let page2 = "";


                        if(cables.length > 0){

                            cables.forEach(function(cable){

                                let cableID = cable.properties.ID ?? "";

                               let direction = getCableDirection(
                                    cable,
                                    layer.getLatLng()
                                );

                                cableDirectionMap[cableID] = direction;

                                page2 += `
                                <p>
                                <b>${cableID}</b>
                                ${cableID.includes("Stub") ? "" : direction}
                                </p>
                            `;

                            });

                        }
                        else{

                            page2 = "No cables intersecting this point";

                        }

                        let page3 = page1;


                        cables.forEach(function(cable){

                            let cableID = cable.properties.ID ?? "";

                            // Skip Stub cables
                            if(cableID.toLowerCase().includes("stub")){
                                return;
                            }

                            let direction = getCableDirection(
                                cable,
                                layer.getLatLng()
                            );


                            //let cableID = cable.properties.ID;


                            let regex = new RegExp(
                                "(" + cableID + "\\s*\\([^)]*\\))",
                                "g"
                            );


                            page3 = page3.replace(
                                regex,
                                "$1 " + direction
                            );


                        });

                        

                        let popup = layer.getPopup().getElement();

                    popup.querySelector(".page2").innerHTML = page2;
                    popup.querySelector(".page3").innerHTML = page3;
                    let page4 = createPage4(page3);
                        

                    

                    });

                }

            }).addTo(map);


            fitMap(pointLayer);

        }



        if(type === "line"){

            let geojson = JSON.parse(e.target.result);
            lineFeatures.push(...geojson.features);
            


            lineLayer = L.geoJSON(geojson,{

                pane: 'linePane',

                style:{
                    color:"red",
                    weight:4
                },


                onEachFeature:function(feature,layer){

                    layer.bindPopup(
                        JSON.stringify(
                            feature.properties,
                            null,
                            2
                        )
                    );

                }


            }).addTo(map);


            fitMap(lineLayer);

        }


    };


    reader.readAsText(file);

}



function fitMap(layer){

    let bounds = layer.getBounds();

    if(bounds.isValid()){
        map.fitBounds(bounds,{
            padding:[20,20]
        });
    }

}

function showPage(btn, page){

    let popup = btn.closest(".leaflet-popup-content");


    let page1 = popup.querySelector(".page1");
    let page2 = popup.querySelector(".page2");
    let page3 = popup.querySelector(".page3");
    let page4 = popup.querySelector(".page4");

    if(page === 1){

    page1.style.display = "block";
    page2.style.display = "none";
    page3.style.display = "none";
    page4.style.display = "none";

    }


    if(page === 2){

        page1.style.display = "none";
        page2.style.display = "block";
        page3.style.display = "none";
        page4.style.display = "none";

    }


    if(page === 3){

        page1.style.display = "none";
        page2.style.display = "none";
        page3.style.display = "block";
        page4.style.display = "none";

    }

    if(page === 4){

    page1.style.display = "none";
    page2.style.display = "none";
    page3.style.display = "none";
    page4.style.display = "block";

}

}

function getIntersectingCables(latlng){

    let point = turf.point([
        latlng.lng,
        latlng.lat
    ]);

    let cables = [];


    lineFeatures.forEach(function(feature){

        let line = turf.lineString(
            feature.geometry.coordinates
        );


        let distance = turf.pointToLineDistance(
            point,
            line,
            {
                units:"meters"
            }
        );


        if(distance <= 10){

            cables.push(feature);

        }

    });


    return cables;

}

function getCableDirection(feature, latlng){

    let coords = feature.geometry.coordinates;


    let point = turf.point([
        latlng.lng,
        latlng.lat
    ]);


    let start = turf.point(coords[0]);
    let end = turf.point(coords[coords.length-1]);


    let distStart = turf.distance(
        point,
        start,
        {units:"meters"}
    );


    let distEnd = turf.distance(
        point,
        end,
        {units:"meters"}
    );


    let bearing;


    // near start point
    if(distStart < distEnd){

        bearing = turf.bearing(
            turf.point(coords[0]),
            turf.point(coords[1])
        );

    }

    // near end point
    else{

        bearing = turf.bearing(
            turf.point(coords[coords.length-1]),
            turf.point(coords[coords.length-2])
        );

    }


    return bearingToDirection(bearing);

}

function bearingToDirection(bearing){

    if(bearing < 0){
        bearing += 360;
    }


    if (bearing >= 348.75 || bearing < 11.25) return "N";
  if (bearing >= 11.25 && bearing < 78.75) return "NE";
  if (bearing >= 78.75 && bearing < 101.25) return "E";
  if (bearing >= 101.25 && bearing < 168.75) return "SE";
  if (bearing >= 168.75 && bearing < 191.25) return "S";
  if (bearing >= 191.25 && bearing < 258.75) return "SW";
  if (bearing >= 258.75 && bearing < 281.25) return "W";
  if (bearing >= 281.25 && bearing < 348.75) return "NW";


}

function mergeCableRanges(content){

    let lines = content.split("<br>");

    let result = [];

    let skipIndexes = new Set();


    for(let i = 0; i < lines.length; i++){


        if(skipIndexes.has(i)){
            continue;
        }


        let current = lines[i];


        let currentMatch = current.match(
            /(In:|Out:)\s*(.*?)\s\((\d+)(?:-(\d+))?\)\s*([A-Z]+)/
        );


        if(currentMatch){


            let nextIndex = i + 1;


            // find next In:
            while(
                nextIndex < lines.length &&
                !lines[nextIndex].startsWith("In:")
            ){
                nextIndex++;
            }


            let next = lines[nextIndex];


            let nextMatch = next?.match(
                /(In:|Out:)\s*(.*?)\s\((\d+)(?:-(\d+))?\)\s*([A-Z]+)/
            );

            let nextOut = lines[nextIndex + 1] ?? "";

            if(nextMatch){


                let currentStart = Number(currentMatch[3]);

                let currentEnd = Number(
                    currentMatch[4] ?? currentMatch[3]
                );


                let nextStart = Number(nextMatch[3]);

                let nextEnd = Number(
                    nextMatch[4] ?? nextMatch[3]
                );



                // same cable + same direction + continuous fiber
                if(
                    currentMatch[2] === nextMatch[2] &&
                    currentMatch[5] === nextMatch[5] &&
                    nextStart === currentEnd + 1  &&
                    nextOut.includes("Splitter")
                ){


                    result.push(
                        currentMatch[1] +
                        " " +
                        currentMatch[2] +
                        " ("+
                        currentStart +
                        "-" +
                        nextEnd +
                        ") " +
                        currentMatch[5]
                    );


                    // remove passthrough after the first Out cable
                    if(
                        lines[i+2] &&
                        lines[i+2].trim() === "(Passthrough)"
                    ){

                        skipIndexes.add(i+2);

                    }


                    


                    // remove old second In line
                    //skipIndexes.add(nextIndex);


                    continue;

                }

            }

        }


        result.push(current);

    }


    return result.join("<br>");

}

function parseFiberRange(line){

    let match = line.match(
        /(In:|Out:)\s*(.*?)\s\((\d+)(?:-(\d+))?\)/
    );


    if(!match){
        return null;
    }


    return {

        cable: match[2],

        start:Number(match[3]),

        end:Number(match[4] ?? match[3])

    };

}



function replaceFiberRange(line,start,end){

    return line.replace(
        /\(\d+(?:-\d+)?\)/,
        "(" + start + "-" + end + ")"
    );

}

function generateAllPage4(){

    exportedFeatures.forEach(function(exportFeature){

        let latlng = L.latLng(
            exportFeature.geometry.coordinates[1],
            exportFeature.geometry.coordinates[0]
        );


        let pointFeature = pointLayer
            .toGeoJSON()
            .features
            .find(f =>
                f.properties.ID === exportFeature.properties.Handhole_ID
            );


        if(!pointFeature){
            return;
        }


        let p = pointFeature.properties;


        let page1 = `
            <b>${p["ID"] ?? ""}</b><br>
            <b>${p["Tier Rating"] ?? ""} ${p["Size"] ?? ""}</b>
        `;


        if(p["Spec_1"] && p["lines"]){
            page1 += `
            <br><br>
            <b>${p["Spec_1"]}</b><br>
            ${p["lines"]?.replace(/\n/g,"<br>")
            .replace(/Demand/g, "Spare for " + p["Spec_1"]) ?? ""}
            `;
        }


        if(p["Spec_2"] && p["lines_2"]){
            page1 += `
            
            <b>${p["Spec_2"]}</b><br>
            ${p["lines_2"]?.replace(/\n/g,"<br>")
            .replace(/Demand/g, "Spare for " + p["Spec_2"]) ?? ""}
            `;
        }


        if(p["Spec_3"] && p["lines_3"]){
            page1 += `
            
            <b>${p["Spec_3"]}</b><br>
            ${p["lines_3"]?.replace(/\n/g,"<br>")
            .replace(/Demand/g, "Spare for " + p["Spec_3"]) ?? ""}
            `;
        }


        let cables = getIntersectingCables(latlng);


        let page3 = page1;


        cables.forEach(function(cable){

            let cableID = cable.properties.ID ?? "";

            // Skip Stub cables
            if(cableID.toLowerCase().includes("stub")){
                return;
            }

            let direction = getCableDirection(
                cable,
                latlng
            );


            //let cableID = cable.properties.ID;


            let regex = new RegExp(
                "(" + cableID + "\\s*\\([^)]*\\))",
                "g"
            );


            page3 = page3.replace(
                regex,
                "$1 " + direction
            );

        });


        // THIS IS THE REAL PAGE 4
        let page4 = createPage4(page3);

        // remove unnecessary whitespace
        page4 = removeHTMLWhitespace(page4);                                                                                                        

        exportFeature.properties.Page4_Content = page4;

    });

}

function createPage4(page3){

    return mergeCableRanges(page3)
        .replace(
            /\(Passthrough\)/g,
            "<b>(Passthrough)</b>"
        );

}
function removeHTMLWhitespace(content){

    return content
        .replace(/\s+/g, " ")   // remove multiple spaces/new lines
        .replace(/>\s+</g, "><") // remove spaces between HTML tags
        .trim();

}

function downloadGeoJSON(){


    let geojson = {
        type:"FeatureCollection",
        features: exportedFeatures
    };


    let blob = new Blob(
        [
            JSON.stringify(
                geojson,
                null,
                2
            )
        ],
        {
            type:"application/json"
        }
    );


    let url = URL.createObjectURL(blob);


    let a = document.createElement("a");

    a.href = url;

    a.download = "Handhole_Page4_Content.geojson";

    document.body.appendChild(a);

    a.click();


    document.body.removeChild(a);

    URL.revokeObjectURL(url);

}

document
.getElementById("pointFile")
.addEventListener("change",function(e){

    loadGeoJSON(
        e.target.files[0],
        "point"
    );

});



document
.getElementById("lineFile")
.addEventListener("change", function(e){

    let files = e.target.files;

    let loaded = 0;


    for(let i = 0; i < files.length; i++){

        loadGeoJSON(
            files[i],
            "line"
        );

        loaded++;

    }


    // wait until all line files are loaded
    setTimeout(function(){

        generateAllPage4();

        console.log("Page4 generated");

    },1000);


});


</script>
</body>
</html>
